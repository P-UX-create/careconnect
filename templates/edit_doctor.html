{% extends "base.html" %}

{% block content %}

<h2>Edit Doctor</h2>

<div class="panel">

    <form method="POST">

        <div class="form-grid">

            <input
                type="text"
                name="fullname"
                value="{{ doctor.fullname }}"
                required>

            <input
                type="text"
                name="specialization"
                value="{{ doctor.specialization }}"
                required>

            <input
                type="text"
                name="phone"
                value="{{ doctor.phone }}"
                required>

            <input
                type="email"
                name="email"
                value="{{ doctor.email }}">

            <input
                type="text"
                name="room_number"
                value="{{ doctor.room_number }}">

        </div>

        <button class="btn-submit">
            Update Doctor
        </button>

    </form>

</div>

{% endblock %}
